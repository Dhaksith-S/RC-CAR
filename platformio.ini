; ESP32 Wi-Fi RC Car — firmware, Phase 1 (Wi-Fi AP + HTTP API + motor control + failsafe)
; Board: generic ESP32 dev board (WROOM-32). If your specific board needs a different
; entry (e.g. esp32doit-devkit-v1), change "board" below — everything else is unaffected.

[env:esp32dev]
; Using the pioarduino platform fork (pinned to Arduino-ESP32 3.3.11 / ESP-IDF 5.5.5) because the
; official PlatformIO "espressif32" registry package still bundles the old Arduino-ESP32 2.0.x
; core, which lacks the pin-based ledcAttach()/ledcWrite() API this firmware's motor_control.cpp uses.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 230400
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
  